# Covenant manifest.
# llm, sql and rovo:mcp were declared from the first deploy, because adding llm
# or sql later forces a major version upgrade.
#
# app.id was set by `forge register covenant` (Developer Space dheeru-dev).
app:
  id: ari:cloud:ecosystem::app/0eb73671-31a0-4410-ae90-4d8ba0607caa
  runtime:
    name: nodejs22.x

modules:
  jira:issuePanel:
    - key: covenant-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Covenant
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  # The portfolio register: every obligation by due date. One global page per app.
  jira:globalPage:
    - key: covenant-register
      resource: register
      resolver:
        function: resolver
      render: native
      title: Covenant register

  # Preflight, the decision lead time, the daily check and the sample workspace. Its resolvers check for Jira admin themselves.
  jira:adminPage:
    - key: covenant-admin
      resource: admin
      resolver:
        function: resolver
      render: native
      title: Covenant

  # Recomputes notice windows and opens "Decision due" items. Runs as the app, so it never calls Teamwork Graph.
  scheduledTrigger:
    - key: covenant-daily
      function: dailyJob
      interval: day

  # Extraction runs here, not in the 25 s resolver: the Extract button only queues it.
  consumer:
    - key: extraction-consumer
      queue: covenant-extraction
      function: extractionWorker
    - key: sample-consumer
      queue: covenant-sample
      function: sampleWorker

  # One per app. Only the claude family exists today.
  llm:
    - key: covenant-llm
      model:
        - claude

  # Forge SQL. No foreign keys, one statement per query.
  sql:
    - key: main
      engine: mysql

  # S4: one harmless read-only tool, exposed through the Atlassian MCP server.
  action:
    - key: covenant-ping
      name: Covenant ping
      function: spikePing
      actionVerb: GET
      description: >
        Checks that the Covenant app is installed and reachable. Use it only
        when asked to test the Covenant connection. Returns a small status
        object and reads no contract data.
      inputs:
        note:
          title: Note
          type: string
          required: false
          description: Optional short text. Only its length is echoed back.

  # One per app, name at most 30 characters, tools are action keys.
  rovo:mcp:
    - key: covenant-mcp
      name: Covenant
      tools:
        - covenant-ping

  function:
    - key: resolver
      handler: index.handler
    - key: extractionWorker
      handler: index.extractionWorker
      timeoutSeconds: 900
    - key: dailyJob
      handler: index.dailyJob
      timeoutSeconds: 300
    - key: sampleWorker
      handler: index.sampleWorker
      timeoutSeconds: 900
    - key: spikePing
      handler: index.spikePing

resources:
  - key: main
    path: src/frontend/index.tsx
  - key: register
    path: src/frontend/register.tsx
  - key: admin
    path: src/frontend/admin.tsx

permissions:
  scopes:
    # Read the work item and download its attachments.
    - read:jira-work
    # Create the child work items a reviewer approves, as that reviewer. Nothing is written without an approval.
    - write:jira-work
    # S3: Teamwork Graph, one scope per object type the query touches.
    # A missing graph scope does not fail: it silently returns less data.
    - read:graph:issue:jira
    - read:graph:issue-status:jira
    - read:graph:user:atlassian
    # Decision brief context: goals on the contract's work item, teams on its space, comments on linked work.
    - read:graph:goal:atlassian
    - read:graph:team:atlassian
    - read:graph:issue-comment:jira
    - read:graph:project:jira
